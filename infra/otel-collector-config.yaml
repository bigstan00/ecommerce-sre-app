# aiobs: starter OpenTelemetry Collector config (created from scratch).
#
# Your services emit telemetry but no collector was configured to receive and
# forward it. This receives OTLP from them and ships it to your backend.
#
# The backend endpoint below was filled from the OTLP endpoint saved in aiobs.
# Add its auth/headers if your backend needs them (keep secrets in your secret
# store, not in this file).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s

exporters:
  # Endpoint filled from your saved OTLP endpoint — add auth/headers if needed.
  otlp/backend:
    endpoint: otel-collector.telemetry.svc:4317
    tls:
      insecure: false
  # A local view while you wire up the backend — remove in production.
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/backend, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/backend, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/backend, debug]
