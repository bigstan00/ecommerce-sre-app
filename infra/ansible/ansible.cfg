[defaults]
inventory = inventory.ini
host_key_checking = False
; Skipping the manual "yes/no, trust this host key" prompt Ansible would
; otherwise show for each of the 3 nodes. Reasonable here because these
; are servers we just created ourselves seconds ago via Terraform — we
; already know exactly what they are. This is NOT something you'd do
; connecting to a server you didn't just provision yourself.
