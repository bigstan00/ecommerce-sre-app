# Ansible inventory: who to configure, and how to reach them. IPs are
# copied straight from `terraform output` — if the cluster is ever
# torn down and rebuilt, these need updating (worker IPs especially,
# since only the control plane got a static Elastic IP).
[control_plane]
control-plane ansible_host=13.63.120.61 private_ip=10.0.1.140

[workers]
worker-0 ansible_host=51.20.117.73 private_ip=10.0.1.21
worker-1 ansible_host=13.60.20.61 private_ip=10.0.2.80

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/k8s-cluster-key
