apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: bigstan00/ecommerce-payment:latest
          ports:
            - containerPort: 4005
          envFrom:
            - secretRef:
                name: payment-db-url # provides DATABASE_URL
          env:
            - { name: PORT, value: "4005" }
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
            - { name: PAYMENT_FAILURE_RATE, value: "0.1" }
            - { name: PAYMENT_LATENCY_MS_MIN, value: "200" }
            - { name: PAYMENT_LATENCY_MS_MAX, value: "1500" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://localhost:4318" }
            - { name: OTEL_SERVICE_NAME, value: "payment-service" }
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 10
---
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: ecommerce
spec:
  selector:
    app: payment
  ports:
    - port: 4005
      targetPort: 4005
