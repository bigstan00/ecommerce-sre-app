apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: bigstan00/ecommerce-auth:latest
          ports:
            - containerPort: 4001
          envFrom:
            - secretRef:
                name: auth-db-url # provides DATABASE_URL
            - secretRef:
                name: app-shared-secrets # provides JWT_SECRET (and ADMIN_TOKEN, unused here — harmless)
          env:
            - { name: PORT, value: "4001" }
            - { name: ACCESS_TOKEN_TTL, value: "15m" }
            - { name: REFRESH_TOKEN_TTL, value: "7d" }
            - { name: LOG_LEVEL, value: "info" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://localhost:4318" }
            - { name: OTEL_SERVICE_NAME, value: "auth-service" }
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
---
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: ecommerce
spec:
  selector:
    app: auth
  ports:
    - port: 4001
      targetPort: 4001
