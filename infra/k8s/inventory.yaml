apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: bigstan00/ecommerce-inventory:latest
          ports:
            - containerPort: 4006
          envFrom:
            - secretRef:
                name: inventory-db-url    # provides DATABASE_URL
            - secretRef:
                name: app-shared-secrets  # provides ADMIN_TOKEN (and JWT_SECRET, unused here — harmless)
          env:
            - { name: PORT, value: "4006" }
            - { name: KAFKA_BROKERS, value: "kafka:9092" }
            - { name: CATALOG_SERVICE_URL, value: "http://catalog:4002" } # only used by cmd/seed, harmless for the main server
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://localhost:4318" }
            - { name: OTEL_SERVICE_NAME, value: "inventory-service" }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: ecommerce
spec:
  selector:
    app: inventory
  ports:
    - port: 4006
      targetPort: 4006
