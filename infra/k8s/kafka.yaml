# StatefulSet, not Deployment: gives this pod a stable identity
# (kafka-0, always the same name) and a real EBS-backed disk that
# follows it across restarts/rescheduling. KRaft mode (no separate
# ZooKeeper needed — modern Kafka can run its own metadata quorum
# internally).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ecommerce
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - containerPort: 9092
          env:
            # KRaft mode: this node acts as both broker and controller.
            # Once you override ANY KAFKA_* env var on this image, its
            # own auto-fill of these three stops happening — all three
            # must be set explicitly together, not just one of them.
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            # The address OTHER pods actually use to reach this broker —
            # must be the Service's in-cluster DNS name, not localhost,
            # or every other service's connection will fail even though
            # Kafka itself looks healthy.
            - {
                name: KAFKA_ADVERTISED_LISTENERS,
                value: "PLAINTEXT://kafka.ecommerce.svc.cluster.local:9092"
              }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            # These three all default to 3 (assuming a real multi-broker
            # cluster) — on a single broker they'd never be satisfiable,
            # and every topic/transaction would fail to be created.
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 10
  # Replaces the old `volumes: emptyDir` block. Each replica (just
  # kafka-0 here) gets its own real PersistentVolumeClaim, created
  # automatically from this template — an actual EBS disk provisioned
  # via the ebs-gp3 StorageClass, not temporary node scratch space.
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: ebs-gp3
        resources:
          requests:
            storage: 5Gi
---
---
# clusterIP: None makes this a "headless" Service — required for a
# StatefulSet to give its pod a stable DNS identity. Existing app code
# that connects to `kafka:9092` is unaffected: for a single replica,
# that name still resolves, it just now returns the pod's real IP
# directly instead of a virtual load-balanced one.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
