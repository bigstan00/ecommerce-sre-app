apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: bigstan00/ecommerce-catalog:latest
          ports:
            - containerPort: 4002
          envFrom:
            - secretRef:
                name: mongo-uri # provides MONGO_URI
            - secretRef:
                name: app-shared-secrets # provides ADMIN_TOKEN (and JWT_SECRET, unused here — harmless)
          env:
            - { name: PORT, value: "4002" }
            - { name: MONGO_DB_NAME, value: "catalog" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://localhost:4318" } # no collector deployed yet — logs a warning, never blocks startup
            - { name: OTEL_SERVICE_NAME, value: "catalog-service" }
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
---
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ecommerce
spec:
  selector:
    app: catalog
  ports:
    - port: 4002
      targetPort: 4002
