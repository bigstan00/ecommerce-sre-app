# The identity the self-hosted CI runner authenticates as. Deliberately
# NOT the cluster-admin kubeconfig every manual command in this project
# has used so far — a compromised or misconfigured CI job should only
# ever be able to do the one thing it needs (roll out new images), not
# touch RBAC, Secrets, other namespaces, or anything else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: ci
---
# Scoped to the ecommerce namespace only — this Role doesn't exist
# anywhere else, so even a token from this ServiceAccount is useless
# outside this one namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: ecommerce
rules:
  # Read+update Deployments (the actual "roll out a new image" action)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Read-only on ReplicaSets/Pods — `kubectl rollout status` inspects
  # these to determine whether a rollout actually succeeded.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
# Binds the ServiceAccount (identity, lives in `ci`) to the Role
# (permissions, scoped to `ecommerce`) — RoleBindings can reference a
# ServiceAccount from a different namespace than the Role itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: ecommerce
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: ci
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
