apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: bigstan00/ecommerce-admin:latest
          ports:
            - containerPort: 3001
          # Same note as frontend.yaml: NEXT_PUBLIC_API_URL is baked in at
          # build time, not read here at runtime.
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: ecommerce
spec:
  type: NodePort
  selector:
    app: admin
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30091
